server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files and fall back to SPA entry point
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic gzip for smaller payloads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/octet-stream;
    gzip_min_length 256;
}
